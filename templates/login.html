<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Вход | CCTV Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg border-secondary" style="width: 380px;">
        <div class="text-center mb-4">
            <div class="display-5 text-primary mb-2"><i class="bi bi-camera-video-fill"></i></div>
            <h3 class="fw-bold text-primary">CCTV Manager</h3>
            <p class="text-muted small">Панель управления камерами и роутерами</p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 small d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label small text-muted">Логин</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" value="admin" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" class="form-control" required autofocus placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Войти
            </button>
        </form>
    </div>
</body>
</html>
